name: Release

# Publishing a GitHub release drives the npm publish, so the release notes and
# the published version are the same act and the tag is created by the release
# itself. There is deliberately no `push: tags` trigger: creating a release from
# a new tag fires both events, and the second publish would fail on a version
# that already exists.
#
# `workflow_dispatch` runs the same pipeline on demand and defaults to a dry
# run, so the whole thing — including the OIDC exchange with the registry — can
# be proved out before a release is published. Note that a dry run only works
# against a version that is not on the registry yet: bump `package.json` first,
# rehearse, then cut the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball, but do not upload it'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The expensive checks run first and without the environment, so the reviewer
  # who approves the publish is approving a build that has already passed.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release ${TAG} does not match package.json version ${version}." >&2
            echo "Bump package.json and re-cut the release, or fix the tag." >&2
            exit 1
          fi
          echo "Releasing $version"

      # The release gate is the differential suite, not just the unit tests:
      # this parser's contract is "identical output to typescript-eslint", so
      # that is what has to hold before a version goes out. The reference lives
      # in its own install, which is what keeps `typescript` out of the tree the
      # package under test runs in.
      - name: Install the reference parser
        run: npm install --no-audit --no-fund
        working-directory: conformance/reference

      - run: npm run build
      - run: npm run conformance:corpus
      - run: npm run conformance:snapshot

      - name: Differential AST test — in-repo fixtures
        run: node conformance/run.mjs

      - name: Differential AST test — external corpus
        run: >
          node conformance/run.mjs
          --snapshots conformance/.snapshots-corpus
          --strictness conformance/strictness-corpus.json

      - name: Differential rule and --fix test
        run: node conformance/lint.mjs conformance/.corpus --fix

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Must match the environment name in the npm trusted publisher config: npm
    # checks the `environment` claim on the OIDC token, and a mismatch is
    # rejected rather than silently ignored. The environment's protection rules
    # gate the commit; npm's staged publishing then gates the tarball.
    environment: npm-publish
    permissions:
      contents: read
      # Trusted publishing: the job mints a short-lived OIDC token that npm
      # exchanges for publish rights, and Sigstore uses to attest the tarball
      # came from this workflow and commit. There is no npm token anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check npm is new enough for staged publishing
        run: |
          version="$(npm --version)"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 15 ]; }; then
            echo "npm $version is too old for staged publishing; 11.15.0+ is required." >&2
            exit 1
          fi
          echo "npm $version"

      # `npm stage publish`, not `npm publish`: the trusted publisher is
      # configured stage-only, so a direct publish from here is rejected by the
      # registry. The tarball lands in the stage queue and goes live only once a
      # maintainer approves it with 2FA — which means a compromised run of this
      # workflow cannot put anything on the registry by itself.
      #
      # `prepublishOnly` fires for `npm stage publish` exactly as it does for
      # `npm publish`, so the build, typecheck, lint, unit tests and packaged
      # no-typescript check all still run before the tarball is produced.
      - name: Stage the release on npm
        env:
          # A release marked as a prerelease goes out under `next`, so it never
          # becomes what a plain `npm install eslint-parser-oxc` resolves to.
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--provenance --access public --tag "$DIST_TAG")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npm stage publish "${args[@]}"

      - name: Summary
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$DRY_RUN" = "true" ]; then
            echo "### Dry run of eslint-parser-oxc@$version — nothing was staged" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Staged eslint-parser-oxc@$version for the \`$DIST_TAG\` tag"
              echo ""
              echo "It is **not on the registry yet.** A maintainer has to approve it with 2FA:"
              echo ""
              echo '```bash'
              echo "npm stage list eslint-parser-oxc"
              echo "npm stage view <stage-id>       # inspect what would go live"
              echo "npm stage approve <stage-id>"
              echo '```'
              echo ""
              echo "Or approve it on https://www.npmjs.com/package/eslint-parser-oxc"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
