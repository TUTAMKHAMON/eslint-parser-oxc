name: Release

# Publishing is driven by a tag: `git tag v0.1.0 && git push origin v0.1.0`.
#
# `workflow_dispatch` runs the same pipeline on demand and defaults to a dry
# run, so the whole thing — including registry authentication — can be proved
# out before a tag is pushed and a version number is spent for good.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball, but do not upload it'
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance: the job mints a short-lived OIDC token that
  # Sigstore uses to attest the tarball came from this workflow and commit.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
          echo "Releasing $version"

      # The release gate is the differential suite, not just the unit tests:
      # this parser's contract is "identical output to typescript-eslint", so
      # that is what has to hold before a version goes out. The reference lives
      # in its own install, which is what keeps `typescript` out of the tree the
      # package under test runs in.
      - name: Install the reference parser
        run: npm install --no-audit --no-fund
        working-directory: conformance/reference

      - run: npm run build
      - run: npm run conformance:corpus
      - run: npm run conformance:snapshot

      - name: Differential AST test — in-repo fixtures
        run: node conformance/run.mjs

      - name: Differential AST test — external corpus
        run: >
          node conformance/run.mjs
          --snapshots conformance/.snapshots-corpus
          --strictness conformance/strictness-corpus.json

      - name: Differential rule and --fix test
        run: node conformance/lint.mjs conformance/.corpus --fix

      - name: Check the registry credential is present
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not set on this repository." >&2
            echo "Create an npm granular access token with write access to packages," >&2
            echo "then: gh secret set NPM_TOKEN" >&2
            exit 1
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `prepublishOnly` runs the build, typecheck, lint, unit tests and the
      # packaged no-typescript check before the tarball is uploaded.
      - name: Publish to npm
        run: npm publish --provenance --access public ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "### Dry run of eslint-parser-oxc@$version — nothing was uploaded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published eslint-parser-oxc@$version" >> "$GITHUB_STEP_SUMMARY"
            echo "https://www.npmjs.com/package/eslint-parser-oxc/v/$version" >> "$GITHUB_STEP_SUMMARY"
          fi
